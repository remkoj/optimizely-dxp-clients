enableGlobalCache: true

enableTelemetry: false

injectEnvironmentFiles:
  - .env.yarn?
  - .env.yarn.local?

nodeLinker: node-modules

packageExtensions:
  "@optiaxiom/react@^3.6":
    dependencies:
      react-is: "^19"
  openapi-typescript-codegen@*:
    dependencies:
      "@types/json-schema": "*"

pnpMode: strict
